name: contract-tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run contract unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate real-paper smoke audit
        run: python tests/validate_audit.py tests/fixtures/resnet-smoke-audit.md
